<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌐 Language Translator</h1>
        <p class="subtitle">
            Translate text quickly between multiple languages
        </p>

        <div class="language-selection">

            <div class="language-box">
                <label for="sourceLanguage">From:</label>
        
                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="kn-IN">Kannada</option>
                    <option value="ml-IN">Malayalam</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                </select>
            </div>
        
            <button id="swapButton" title="Swap languages">⇄</button>
        
            <div class="language-box">
                <label for="targetLanguage">To:</label>
        
                <select id="targetLanguage">
                    <option value="hi-IN">Hindi</option>
                    <option value="en">English</option>
                    <option value="kn-IN">Kannada</option>
                    <option value="ml-IN">Malayalam</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                </select>
            </div>
        
        </div>   

        <div class="text-area-container">

            <div>
                <h3>Enter Text</h3>

                <textarea 
                id="inputText" 
                maxlength="500"
                placeholder="Type your text here..."></textarea>
            
            <p id="characterCount">0 / 500 characters</p>  
                </textarea>
            </div>

            <div>
                <h3>Translation</h3>

                <textarea 
                    id="outputText" 
                    placeholder="Translation will appear here..."
                    readonly>
                </textarea>
            </div>

        </div>

        <button id="translateButton">Translate</button>

        <button id="copyButton">Copy Translation</button>
        <button id="speakButton">🔊 Listen</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
